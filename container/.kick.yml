version: 1
from: "ghcr.io/nfra-project/kickstart-flavor-php:8.4"
ports: "80:80"

packages: [ruby, ruby-dev, build-essential, libssl-dev, pkg-config,
  ca-certificates, zip, unzip, php8.5-zip]

command:
  build:
    - "sudo bash ./install-jekyll.sh"
    - >-
      php -r 'if (!extension_loaded("zip")) { throw new RuntimeException("PHP zip extension missing"); }'
    - "sudo mkdir -p /tmp/jekyll-builder"
    - "sudo chown user:user /tmp/jekyll-builder"
